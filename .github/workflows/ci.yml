name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore DC-ScreenSharing.sln

      - name: Build solution
        run: dotnet build DC-ScreenSharing.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test DC-ScreenSharing.sln --configuration Release --no-build --verbosity normal
